    <rect x="296" y="212" width="34" height="34" rx="8" fill="#1164a3"/><text x="313" y="235" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">A</text>
    <text x="344" y="228" font-size="15" font-weight="800" fill="#1d1c1d">Park (Company A) <tspan fill="#9a8b9b" font-weight="500" font-size="12.5">9:20 AM</tspan></text>
    <text x="344" y="252" font-size="14.5" fill="#1d1c1d">Got it. We just need to adjust week 3's volume.</text>
  </g>
  <!-- AI thread summary card -->
  <rect x="296" y="286" width="678" height="150" rx="14" fill="#f5f3ff" stroke="#d9d0ff"/>
  <text x="318" y="318" font-size="16" font-weight="800" fill="#5b3fd6">🤖  Channel conversation summary (Agent)</text>
  <g font-size="14.5" fill="#3a4355" font-weight="600">
    <circle cx="326" cy="346" r="4" fill="#7b61ff"/><text x="342" y="351">All messages &amp; files accumulate in one channel — nothing scatters across email &amp; calls</text>
    <circle cx="326" cy="376" r="4" fill="#7b61ff"/><text x="342" y="381">Current topic: week 3 delivery volume (owner: Park, Company A)</text>
    <circle cx="326" cy="406" r="4" fill="#7b61ff"/><text x="342" y="411">Next action: reply with adjustment → Kim, by today</text>
  </g>
  <!-- input -->
  <rect x="296" y="556" width="678" height="46" rx="12" fill="#fff" stroke="#c9c2ca"/><text x="316" y="584" font-size="14.5" fill="#9a8b9b">Message the channel shared with Company A…</text>
