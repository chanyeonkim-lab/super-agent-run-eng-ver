    <rect x="40" y="196" width="210" height="60" rx="12" fill="#fff" stroke="#cfe9db"/><rect x="52" y="208" width="36" height="36" rx="9" fill="#eaf6ef"/><text x="70" y="232" font-size="17" text-anchor="middle">🚚</text><text x="100" y="222" font-size="14.5" font-weight="700" fill="#20232a">SCM</text><text x="100" y="244" font-size="12.5" fill="#6b7688">Delivery, inventory, logistics</text>
    <rect x="40" y="270" width="210" height="60" rx="12" fill="#fff" stroke="#cfe9db"/><rect x="52" y="282" width="36" height="36" rx="9" fill="#eaf6ef"/><text x="70" y="306" font-size="17" text-anchor="middle">💬</text><text x="100" y="296" font-size="14.5" font-weight="700" fill="#20232a">Slack / Email</text><text x="100" y="318" font-size="12.5" fill="#6b7688">Messages &amp; inquiry history</text>
    <rect x="40" y="344" width="210" height="60" rx="12" fill="#fff" stroke="#cfe9db"/><rect x="52" y="356" width="36" height="36" rx="9" fill="#eaf6ef"/><text x="70" y="380" font-size="17" text-anchor="middle">📈</text><text x="100" y="370" font-size="14.5" font-weight="700" fill="#20232a">Sales Cloud</text><text x="100" y="392" font-size="12.5" fill="#6b7688">Sales &amp; contract history</text>
    <rect x="40" y="418" width="210" height="60" rx="12" fill="#fff" stroke="#cfe9db"/><rect x="52" y="430" width="36" height="36" rx="9" fill="#eaf6ef"/><text x="70" y="454" font-size="17" text-anchor="middle">🌐</text><text x="100" y="444" font-size="14.5" font-weight="700" fill="#20232a">External data</text><text x="100" y="466" font-size="12.5" fill="#6b7688">News &amp; filings</text>
  </g>

  <!-- connector arrows -->
  <g stroke="#9dd9bb" stroke-width="2.5" fill="none">
    <path d="M250 152 C 320 152, 340 300, 402 300"/>
    <path d="M250 226 C 320 226, 350 300, 402 300"/>
    <path d="M250 300 L 402 300"/>
    <path d="M250 374 C 320 374, 350 300, 402 300"/>
    <path d="M250 448 C 320 448, 340 300, 402 300"/>
