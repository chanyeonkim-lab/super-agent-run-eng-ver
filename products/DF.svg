<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs><linearGradient id="fh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18c974"/><stop offset="1" stop-color="#0e9a58"/></linearGradient></defs>
  <rect width="1000" height="625" fill="#eef6f1"/>
  <rect width="1000" height="62" fill="url(#fh)"/>
  <g fill="#fff"><circle cx="30" cy="28" r="8"/><circle cx="42" cy="24" r="11"/><circle cx="55" cy="30" r="8"/><rect x="22" y="30" width="40" height="10" rx="5"/></g>
  <text x="78" y="39" font-size="22" font-weight="700" fill="#fff">Data Cloud · Customer 360</text>
