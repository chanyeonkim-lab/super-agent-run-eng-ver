    <circle cx="532" cy="176" r="8" fill="none" stroke="#7b61ff" stroke-width="2.5"/><text x="552" y="181">Review &amp; reply to A's quote</text><rect x="880" y="167" width="66" height="20" rx="10" fill="#ffe2dd"/><text x="913" y="181" fill="#e2352b" font-size="11" text-anchor="middle">DUE AM</text>
